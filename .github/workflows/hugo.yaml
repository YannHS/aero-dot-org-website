name: Deploy Hugo site to Cloudflare Pages

on:
  # Production deployment
  push:
    branches:
      - main

  # Preview deployment
  pull_request:

  # Manual deployment from the Actions tab
  workflow_dispatch:

# Required for checking out the repository and commenting on pull requests.
permissions:
  contents: read
  pull-requests: write

# Prevent multiple deployments of the same branch or PR from running together.
# Production deployments are allowed to finish.
concurrency:
  group: cloudflare-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    env:
      HUGO_VERSION: 0.142.0
      CLOUDFLARE_PROJECT_NAME: aero-dot-org-website

    steps:
      - name: Install Hugo CLI
        run: |
          wget \
            -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"

          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch all history for Hugo's .GitInfo and .Lastmod.
          fetch-depth: 0

          # Recursively check out Hugo themes or other Git submodules.
          submodules: recursive

      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: |
            resources/_gen
            ${{ runner.temp }}/hugo_cache
          key: ${{ runner.os }}-hugo-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-hugo-${{ github.ref_name }}-
            ${{ runner.os }}-hugo-main-
            ${{ runner.os }}-hugo-

      - name: Cache Node.js dependencies
        if: ${{ hashFiles('package-lock.json', 'npm-shrinkwrap.json') != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json', 'npm-shrinkwrap.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Node.js dependencies
        run: |
          if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
            npm ci
          else
            echo "No package-lock.json or npm-shrinkwrap.json found; skipping npm ci."
          fi

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --logLevel debug

      - name: Verify build output
        run: |
          test -d public
          test -f public/index.html

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy public
            --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }}
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-dirty=true

      - name: Print deployment URLs
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          BRANCH_PREVIEW_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          echo "Deployment URL: ${DEPLOYMENT_URL}"
          echo "Branch preview URL: ${BRANCH_PREVIEW_URL}"

          {
            echo "## Cloudflare Pages deployment"
            echo
            echo "- **Deployment URL:** ${DEPLOYMENT_URL}"
            echo "- **Branch preview URL:** ${BRANCH_PREVIEW_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Get short SHA of latest commit in PR
        id: short-sha
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "short_sha=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Comment deployment URLs on PR
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            ## Deployed `${{ env.CLOUDFLARE_PROJECT_NAME }}` to Cloudflare Pages

            | Item | Value |
            |:-|:-|
            | **Latest commit** | `${{ steps.short-sha.outputs.short_sha }}` |
            | **Status** | ✅ Deployment successful |
            | **Preview URL** | ${{ steps.deploy.outputs.deployment-url }} |
            | **Branch preview URL** | ${{ steps.deploy.outputs.pages-deployment-alias-url }} |
          comment-tag: cf-preview-url